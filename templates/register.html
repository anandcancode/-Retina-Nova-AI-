{% extends "base.html" %}

{% block title %}Create Account - RetinaNova AI{% endblock %}

{% block content %}
<div class="form-card">
  <div style="text-align: center; margin-bottom: 24px;">
    <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; background: linear-gradient(135deg, #0284c7, #6366f1);">
      <i class="fas fa-user-plus"></i>
    </div>
    <h2 style="font-size: 24px; font-weight: 800; color: var(--primary-navy);">Clinician Registration</h2>
    <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
      Register to save retinal scan evaluations and export clinical reports.
    </p>
  </div>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label class="form-label" for="full_name">Full Name / Clinical Title</label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Dr. Jane Doe (Ophthalmologist)" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Medical Center / Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="name@hospital.org" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password (min. 6 characters)</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" minlength="6" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
      <i class="fas fa-check-circle"></i> Complete Registration
    </button>
  </form>

  <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
    Already registered? <a href="{{ url_for('login') }}" style="font-weight: 600;">Sign in here</a>
  </div>
</div>
{% endblock %}
